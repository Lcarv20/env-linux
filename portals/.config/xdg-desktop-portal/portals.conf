[preferred]
# FileChooser: prefer dux-files (dfiles) for its native UI, GTK as fallback.
# (The gnome backend was failing here: it delegates FileChooser to dfiles
# via D-Bus activation, which intermittently returned "not activatable".
# Routing directly to dfiles skips that broken delegation layer.)
org.freedesktop.impl.portal.FileChooser=dfiles;gtk;
