# Wire bt-resume-rescue into systemd-suspend.service:
#   pre-suspend  -> snapshot connected Bluetooth devices
#   post-resume  -> launch the rescue check DETACHED (systemd-run --no-block)
#                   so the resume job / PrepareForSleep(false) is not delayed.
# "-" prefix: failures (even a missing script) never abort or fail a suspend.
# Why a drop-in: this systemd ignores /etc/systemd/system-sleep/ hooks
# (only /usr/lib/systemd/system-sleep is scanned).
[Service]
ExecStartPre=-/usr/local/sbin/bt-resume-rescue snapshot
ExecStartPost=-/usr/bin/systemd-run --no-block --collect --unit=bt-resume-rescue-run /usr/local/sbin/bt-resume-rescue rescue
